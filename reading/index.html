<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloChiwa Reading</title>
    <link rel="stylesheet" href="css/reading.css">
    <!-- Favicon (Brauzer vkladkasi ikonkasini o'rnatish) -->
    <link rel="icon" type="image/png" href="images/logo.png">
    
</head>
<body>

    <!-- YUQORI MENYU -->
<header class="main-header">
    <div class="nav-container">
        <!-- Sayt logotipi (Rasm + Matn) -->
        <a href="../home.html" class="logo">
            <img src="images/logo.png" alt="HelloChiwa Logo" class="logo-img">
            <span>HELLOCHIWA</span>
        </a>
        
        <nav class="nav-menu">
            <a href="../home.html">Home</a>
            <a href="index.html" class="active">Reading</a>
            <!--<a href="#">Vocabulary</a>-->
            <a href="../about.html">About</a>
            <a href="../faq.html">FAQ</a>
            <a href="../contact.html">Contact</a>
            
            <!-- Kirish tugmasi (mehmonlar uchun) -->
            <button id="authBtn" class="nav-auth-btn">Enter</button>
            
            <!-- Tizimga kirgan foydalanuvchi profili Dropdown menyusi -->
            <div class="user-profile-dropdown" id="userProfileDropdown" style="display: none;">
                <!-- Profil avatar/tugmasi -->
                <button class="profile-avatar-btn" id="profileAvatarBtn">
                    <span class="user-avatar-placeholder">U</span>
                </button>

                <!-- Ochiluvchi dropdown menyu -->
                <div class="dropdown-menu" id="dropdownMenu">
                    <div class="user-info">
                        <span class="user-name" id="userNameText">User</span>
                        <span class="user-email" id="userEmailText">user@mail.com</span>
                    </div>
                    
                    <hr class="dropdown-divider">
                    
                    <!-- Qo'shimcha menyu tugmalari -->
                    <a href="#" class="dropdown-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        Settings
                    </a>
                    
                    <a href="#" class="dropdown-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                        </svg>
                        Bookmarks
                    </a>

                    <hr class="dropdown-divider">

                    <a href="#" class="dropdown-item" id="logoutBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Log Out
                    </a>
                </div>
            </div>
        </nav>
    </div>
</header>

    <!-- ASOSIY KONTENT -->
    <main class="reading-page">

        <header class="reading-header">
            <h1>Reading</h1>
            <p>Choose a language and start reading.</p>
        </header>

        <section class="language-section">
            <div class="section-title">
                <h2>Choose a language</h2>
                <span>10 languages</span>
            </div>

            <div class="language-grid">

                <!-- Japanese -->
                <button class="language-card" data-language="Japanese">
                    <span class="language-code">JP</span>
                    <span class="language-name">Japanese</span>
                    <span class="language-native">日本語</span>
                    <img src="images/flags/jp.svg" alt="Japan Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- English -->
                <button class="language-card" data-language="English">
                    <span class="language-code">US</span>
                    <span class="language-name">English</span>
                    <span class="language-native">English</span>
                    <img src="images/flags/us.svg" alt="US Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- Chinese -->
                <button class="language-card" data-language="Chinese">
                    <span class="language-code">CN</span>
                    <span class="language-name">Chinese</span>
                    <span class="language-native">中文</span>
                    <img src="images/flags/cn.svg" alt="China Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- Korean -->
                <button class="language-card" data-language="Korean">
                    <span class="language-code">KR</span>
                    <span class="language-name">Korean</span>
                    <span class="language-native">한국어</span>
                    <img src="images/flags/kr.svg" alt="Korea Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- Spanish -->
                <button class="language-card" data-language="Spanish">
                    <span class="language-code">ES</span>
                    <span class="language-name">Spanish</span>
                    <span class="language-native">Español</span>
                    <img src="images/flags/es.svg" alt="Spain Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- French -->
                <button class="language-card" data-language="French">
                    <span class="language-code">FR</span>
                    <span class="language-name">French</span>
                    <span class="language-native">Français</span>
                    <img src="images/flags/fr.svg" alt="France Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- German -->
                <button class="language-card" data-language="German">
                    <span class="language-code">DE</span>
                    <span class="language-name">German</span>
                    <span class="language-native">Deutsch</span>
                    <img src="images/flags/de.svg" alt="Germany Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- Italian -->
                <button class="language-card" data-language="Italian">
                    <span class="language-code">IT</span>
                    <span class="language-name">Italian</span>
                    <span class="language-native">Italiano</span>
                    <img src="images/flags/it.svg" alt="Italy Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- Portuguese -->
                <button class="language-card" data-language="Portuguese">
                    <span class="language-code">PT</span>
                    <span class="language-name">Portuguese</span>
                    <span class="language-native">Português</span>
                    <img src="images/flags/pt.svg" alt="Portugal Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

                <!-- Russian -->
                <button class="language-card" data-language="Russian">
                    <span class="language-code">RU</span>
                    <span class="language-name">Russian</span>
                    <span class="language-native">Русский</span>
                    <img src="images/flags/ru.svg" alt="Russia Flag" class="language-flag">
                    <span class="language-arrow">→</span>
                </button>

            </div>

        </section>

    </main>

    <!-- PASTKI FOOTER -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="../about.html">About HelloChiwa</a>
                <a href="../contact.html">Contact</a>
                <a href="../faq.html">FAQ</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Cookie Policy</a>
                <a href="#">Sitemap</a>
            </div>
            <p class="copyright">&copy; 2026 HelloChiwa. All rights reserved.</p>
        </div>
    </footer>
    <!-- Supabase JS Library (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Client -->
    <script src="js/supabaseClient.js"></script>

    <!-- Asosiy JS -->
    <script src="js/reading.js"></script>
    <!-- AUTH MODAL (LOGIN / REGISTER) -->
<div id="authModal" class="auth-modal">
    <div class="auth-modal-content">
        <span class="close-auth-modal" id="closeAuthModal">&times;</span>
        
        <!-- Tab tugmalari -->
        <div class="auth-tabs">
            <button id="loginTabBtn" class="auth-tab-btn active">Kirish</button>
            <button id="registerTabBtn" class="auth-tab-btn">Ro'yxatdan o'tish</button>
        </div>

        <!-- Login Formasi -->
        <form id="loginForm" class="auth-form active">
            <div class="input-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="email@example.com" required>
            </div>
            <div class="input-group">
                <label for="loginPassword">Parol</label>
                <input type="password" id="loginPassword" placeholder="******" required>
            </div>
            <button type="submit" class="auth-submit-btn">Kirish</button>
        </form>

        <!-- Register Formasi -->
        <form id="registerForm" class="auth-form">
            <div class="input-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="email@example.com" required>
            </div>
            <div class="input-group">
                <label for="regPassword">Parol</label>
                <input type="password" id="regPassword" placeholder="Kamida 6 ta belgi" required>
            </div>
            <button type="submit" class="auth-submit-btn">Ro'yxatdan o'tish</button>
        </form>
        
        <p id="authMessage" class="auth-message"></p>
    </div>
</div>
</body>
</html>
