<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloChiwa - Articles</title>
    <link rel="stylesheet" href="reading/css/reading.css">
    <link rel="icon" type="image/png" href="reading/images/logo.png">
</head>
<body>

    <!-- HEADER / NAVIGATSIYA -->
    <header class="main-header">
        <div class="nav-container">
            <!-- 1. Chap tomonda Logo -->
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="HelloChiwa Logo" class="logo-img">
                <span>HelloChiwa</span>
            </a>
            
            <!-- O'ng tomonda tugmalar, tungi rejim va profil -->
            <div class="header-right">
                <button id="darkModeToggle" class="dark-mode-btn" style="background: none; border: none; cursor: pointer; font-size: 1.2rem; margin-left: 10px;">🌙</button>
                <!-- Kirish tugmasi -->
                <button id="authBtn" class="nav-auth-btn">Sign In</button>
                
                <!-- Tizimga kirgan foydalanuvchi profili va Dropdown menyu -->
                <div id="userProfileDropdown" class="user-profile-dropdown" style="display: none;">
                    <div id="profileAvatarBtn" class="profile-avatar" style="width: 38px; height: 38px; border-radius: 50%; background: #292824; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer;">
                        <span class="user-avatar-placeholder">J</span>
                    </div>

                    <!-- Bosilganda ochiladigan menyu (Barcha sahifalar va Chiqish shu yerga ko'chirildi) -->
                    <div id="dropdownMenu" class="dropdown-menu">
                        <a href="home.html" class="dropdown-item">Home</a>
                        <a href="index.html" class="dropdown-item">Reading</a>
                        <a href="about.html" class="dropdown-item">About</a>
                        <a href="faq.html" class="dropdown-item">FAQ</a>
                        <a href="contact.html" class="dropdown-item">Contact</a>
                        <hr style="border: none; border-top: 1px solid #eee; margin: 4px 0;">
                        <button id="logoutBtn" class="dropdown-item" style="color: #e74c3c;">Chiqish</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- MAQOLALAR SECTION -->
    <main class="main-content">
        <section class="articles-section">
            <div class="section-title">
                <h2 id="selectedLanguageTitle">Articles</h2>
                <span id="articlesCount">0 articles</span>
            </div>

            <!-- Maqolalar grid qismi -->
            <div id="articlesGrid" class="articles-grid">
                <p class="loading-text">Loading articles...</p>
            </div>
        </section>
    </main>

    <!-- AUTH MODAL (LOGIN / REGISTER) -->
    <div id="authModal" class="auth-modal">
        <div class="auth-modal-content">
            <span class="close-auth-modal" id="closeAuthModal">&times;</span>
            
            <div class="auth-tabs">
                <button id="loginTabBtn" class="auth-tab-btn active">Kirish</button>
                <button id="registerTabBtn" class="auth-tab-btn">Ro'yxatdan o'tish</button>
            </div>

            <!-- Login Formasi -->
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="email@example.com" required>
                </div>
                <div class="input-group">
                    <label for="loginPassword">Parol</label>
                    <input type="password" id="loginPassword" placeholder="******" required>
                </div>
                <button type="submit" class="auth-submit-btn">Kirish</button>
            </form>

            <!-- Register Formasi -->
            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="email@example.com" required>
                </div>
                <div class="input-group">
                    <label for="regPassword">Parol</label>
                    <input type="password" id="regPassword" placeholder="Kamida 6 ta belgi" required>
                </div>
                <button type="submit" class="auth-submit-btn">Ro'yxatdan o'tish</button>
            </form>
            
            <p id="authMessage" class="auth-message"></p>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="about.html">About Us</a>
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Contact</a>
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
            </div>
            <p class="copyright">&copy; 2026 HelloChiwa. All rights reserved.</p>
        </div>
    </footer>

    <!-- SUPABASE VA ASOSIY SKRIPTLAR -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reading/js/supabaseClient.js"></script>
    <script src="reading/js/reading.js"></script>  
    <script src="reading/js/articles.js"></script>
</body>
</html>
