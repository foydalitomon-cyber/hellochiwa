<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="reading/css/reading.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="reading/images/logo.png">
    <!-- pop up install knopkasi -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#faf9f5">
    <link rel="stylesheet" href="reading/css/install.css">
</head>
<body>

        <!-- YUQORI MENYU -->
<header class="main-header">
    <div class="nav-container">
        <!-- Sayt logotipi (Rasm + Matn) -->
        <a href="index.html" class="logo">
            <img src="reading/images/logo.png" alt="HelloChiwa Logo" class="logo-img">
            <span>HELLOCHIWA</span>
        </a>
        
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="reading.html" class="active">Reading</a>
            <a href="vocabulary.html">Vocabulary</a>
            <a href="about.html">About</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
            
            <!-- 1. Tungi rejim oychasi oldinda turadi -->
            <button id="darkModeToggle" title="Tungi rejim" style="background: none; border: none; cursor: pointer; font-size: 20px; margin-right: 10px;">
                🌙
            </button>

            <!-- 2. Kirish tugmasi uning ortidan keladi -->
            <button id="authBtn" class="nav-auth-btn">Enter</button>
            <!-- Tizimga kirgan foydalanuvchi profili Dropdown menyusi -->
            <div class="user-profile-dropdown" id="userProfileDropdown" style="display: none;">
                <!-- Profil avatar/tugmasi -->
                <button class="profile-avatar-btn" id="profileAvatarBtn">
                    <span class="user-avatar-placeholder">U</span>
                </button>

                <!-- Ochiluvchi dropdown menyu -->
                <div class="dropdown-menu" id="dropdownMenu">
                    <!-- 1. Eng yuqorida Ism va Email -->
                    <div class="dropdown-header" style="padding: 12px 16px; border-bottom: 1px solid #eee;">
                        <div id="dropdownUserName" style="font-weight: bold; color: #333; font-size: 15px;"></div>
                        <div id="dropdownUserEmail" style="font-size: 13px; color: #666; margin-top: 2px;"></div>
                    </div>

                    <!-- 2. Qizil rangli menyu havolalari -->
                    <div class="dropdown-links" style="padding: 8px 0;">
                        <a href="index.html" style="display: block; padding: 8px 16px; color: #e53e3e; text-decoration: none;">Home</a>
                        <a href="reading.html" style="display: block; padding: 8px 16px; color: #e53e3e; text-decoration: none;">Reading</a>
                        <a href="about.html" style="display: block; padding: 8px 16px; color: #e53e3e; text-decoration: none;">About</a>
                        <a href="faq.html" style="display: block; padding: 8px 16px; color: #e53e3e; text-decoration: none;">FAQ</a>
                        <a href="contact.html" style="display: block; padding: 8px 16px; color: #e53e3e; text-decoration: none;">Contact</a>
                        <a href="terms.html" style="display: block; padding: 8px 16px; color: #e53e3e; text-decoration: none;">Terms of Service</a>
                    </div>

                    <!-- 3. Chiqish tugmasi -->
                    <div style="border-top: 1px solid #eee; padding: 8px 0;">
                        <button id="logoutBtn" style="width: 100%; text-align: left; background: none; border: none; padding: 8px 16px; color: #e53e3e; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            Chiqish
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</header>


    <!-- STANDART EKRAN READ-MODE KONTENT -->
    <main class="reader-container">
        <article class="reader-card">
            <div class="article-meta">
                <span id="articleLevel" class="level-badge">Level</span>
                <span id="articleLanguage" class="lang-badge">Language</span>
            </div>
            
            <h1 id="articleTitle" class="reader-title">Loading title...</h1>
            
            <!-- NOTRANSLATE: Maqola matni tarjima qilinmaydi, asl holida o'qiladi -->
            <div id="articleBody" class="reader-body notranslate">
                <p>Loading text...</p>
            </div>

            <!-- Action Buttons (Like & Share) -->
            <div class="article-actions">
                <button class="action-btn like-btn" id="likeBtn">
                    <span class="icon">❤️</span> 
                    <span class="label">Like</span> 
                    <span class="count" id="likeCount">0</span>
                </button>
                <button class="action-btn share-btn" id="shareBtn">
                    <span class="icon">🔗</span> 
                    <span class="label">Share</span>
                </button>
            </div>

            <!-- Comments Section -->
            <section class="comments-section">
                <h3>Comments (<span id="commentCount">0</span>)</h3>

                <!-- Comment Form -->
                <div class="comment-form">
                    <textarea id="commentInput" placeholder="Write a comment..." rows="3"></textarea>
                    <button id="submitCommentBtn">Post Comment</button>
                </div>

                <!-- Comments List -->
                <div class="comments-list" id="commentsList">
                    <!-- Izohlar JavaScript orqali shu yerga yuklanadi -->
                </div>
            </section>
        </article>
    </main>

    <!-- POP-UP MODAL (So'z tushuntirishi uchun) -->
    <div id="wordModal" class="word-modal hidden">
        <div class="word-modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <h3 id="modalWord" class="modal-word-title">Word</h3>
    <!--       <div id="modalBody" class="modal-word-body">
                <p id="modalDefinition">Loading explanation...</p>
                <p id="modalTranslation" class="modal-translation"></p>
            </div> --> 
        </div>
    </div>

     <!-- STICKY AUDIO PLAYER -->
    <audio id="articleAudio" controls class="sticky-audio-player"></audio>
    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="about.html">About Us</a>
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Contact Us</a>
                <a href="privacy-policy.html">Privacy Policy</a> 
                <a href="terms.html">Terms of Service</a>
                <a href="cookie-policy.html">Cookie Policy</a>
            </div>
            <p class="copyright">&copy; 2026 HelloChiwa. All rights reserved.</p>
        </div>
    </footer>

    <!-- AUTH MODAL (LOGIN / REGISTER) -->
<div id="authModal" class="auth-modal">
    <div class="auth-modal-content">
        <span class="close-auth-modal" id="closeAuthModal">&times;</span>
        
        <!-- Tab tugmalari -->
        <div class="auth-tabs">
            <button id="loginTabBtn" class="auth-tab-btn active">Login</button>
            <button id="registerTabBtn" class="auth-tab-btn">Register</button>
        </div>

        <!-- Login Formasi -->
        <form id="loginForm" class="auth-form active">
            <div class="input-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="email@example.com" required>
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="******" required>
            </div>
            <button type="submit" class="auth-submit-btn">Login</button>
        </form>

        <!-- Register Formasi -->
        <form id="registerForm" class="auth-form">
            <div class="input-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="email@example.com" required>
            </div>

            <div class="input-group">
                <label for="regPassword">Password</label>
                <!-- 8 tadan kam bo'lmagan, katta-kichik harf va raqam talab qiluvchi placeholder -->
                <input type="password" id="regPassword" placeholder="Min 8 chars (A-Z, a-z, 0-9)" minlength="8" required>
            </div>

            <button type="submit" class="auth-submit-btn">Register</button>
        </form>

        <!-- Google login -->
        <div class="social-login">
            <button type="button" id="googleLoginBtn" class="social-login-btn">
                Continue with Google
            </button>
        </div>

        <p id="authMessage" class="auth-message"></p>
    </div>
</div>

    <!-- SKRIPTLAR -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reading/js/supabaseClient.js"></script>
    <script src="reading/js/article-detail.js"></script>
    <script src="reading/js/install.js"></script>
</body>
</html>
