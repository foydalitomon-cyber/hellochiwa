<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloChiwa - Reader</title>
    <link rel="stylesheet" href="reading/css/reading.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="reading/images/logo.png">
</head>
<body>

        <!-- HEADER -->
    <header class="main-header">
        <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="articles.html" id="backLink" class="back-link">
                <span>←</span> Back to Articles
            </a>
            
            <div class="header-right" style="display: flex; align-items: center; gap: 10px;">
                <!-- Tungi rejim tugmasi -->
                <button id="darkModeToggle" class="dark-mode-btn" title="Tungi rejim" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;">
                    🌙
                </button>

                <!-- Kirish tugmasi -->
                <button id="authBtn" class="nav-auth-btn">Sign In</button>
                
                <!-- Tizimga kirgan foydalanuvchi profili va Dropdown menyu -->
                <div id="userProfileDropdown" class="user-profile-dropdown" style="display: none; position: relative;">
                    <div id="profileAvatarBtn" class="profile-avatar" style="width: 38px; height: 38px; border-radius: 50%; background: #292824; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer;">
                        <span class="user-avatar-placeholder">J</span>
                    </div>

                    <!-- Bosilganda ochiladigan menyu -->
                    <div id="dropdownMenu" class="dropdown-menu">
                        <a href="index.html" class="dropdown-item">Home</a>
                        <a href="articles.html" class="dropdown-item">Reading</a>
                        <a href="about.html" class="dropdown-item">About</a>
                        <a href="faq.html" class="dropdown-item">FAQ</a>
                        <a href="contact.html" class="dropdown-item">Contact</a>
                        <hr style="border: none; border-top: 1px solid #eee; margin: 4px 0;">
                        <button id="logoutBtn" class="dropdown-item" style="color: #e74c3c; background: none; border: none; width: 100%; text-align: left; cursor: pointer;">Chiqish</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- STANDART EKRAN READ-MODE KONTENT -->
    <main class="reader-container">
        <article class="reader-card">
            <div class="article-meta">
                <span id="articleLevel" class="level-badge">Level</span>
                <span id="articleLanguage" class="lang-badge">Language</span>
            </div>
            
            <h1 id="articleTitle" class="reader-title">Loading title...</h1>
            
            <!-- NOTRANSLATE: Maqola matni tarjima qilinmaydi, asl holida o'qiladi -->
            <div id="articleBody" class="reader-body notranslate">
                <p>Loading text...</p>
            </div>

            <!-- Action Buttons (Like & Share) -->
            <div class="article-actions">
                <button class="action-btn like-btn" id="likeBtn">
                    <span class="icon">❤️</span> 
                    <span class="label">Like</span> 
                    <span class="count" id="likeCount">0</span>
                </button>
                <button class="action-btn share-btn" id="shareBtn">
                    <span class="icon">🔗</span> 
                    <span class="label">Share</span>
                </button>
            </div>

            <!-- Comments Section -->
            <section class="comments-section">
                <h3>Comments (<span id="commentCount">0</span>)</h3>

                <!-- Comment Form -->
                <div class="comment-form">
                    <textarea id="commentInput" placeholder="Write a comment..." rows="3"></textarea>
                    <button id="submitCommentBtn">Post Comment</button>
                </div>

                <!-- Comments List -->
                <div class="comments-list" id="commentsList">
                    <!-- Izohlar JavaScript orqali shu yerga yuklanadi -->
                </div>
            </section>
        </article>
    </main>

    <!-- POP-UP MODAL (So'z tushuntirishi uchun) -->
    <div id="wordModal" class="word-modal hidden">
        <div class="word-modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <h3 id="modalWord" class="modal-word-title">Word</h3>
    <!--       <div id="modalBody" class="modal-word-body">
                <p id="modalDefinition">Loading explanation...</p>
                <p id="modalTranslation" class="modal-translation"></p>
            </div> --> 
        </div>
    </div>

     <!-- STICKY AUDIO PLAYER -->
    <audio id="articleAudio" controls class="sticky-audio-player"></audio>
    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="about.html">About Us</a>
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Contact Us</a>
                <a href="privacy-policy.html">Privacy Policy</a> 
                <a href="terms.html">Terms of Service</a>
                <a href="cookie-policy.html">Cookie Policy</a>
            </div>
            <p class="copyright">&copy; 2026 HelloChiwa. All rights reserved.</p>
        </div>
    </footer>

    <<!-- AUTH MODAL OYNASI (Sign In / Sign Up) -->
    <div id="authModal" class="auth-modal">
        <div class="auth-modal-content">
            <span class="close-auth-modal" id="closeAuthModal">&times;</span>
            
            <div class="auth-tabs">
                <button class="auth-tab-btn active" data-tab="login">Sign In</button>
                <button class="auth-tab-btn" data-tab="register">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="example@gmail.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="********">
                </div>
                <button type="submit" class="auth-submit-btn">Sign In</button>
                <div id="loginMessage" class="auth-message"></div>
            </form>

            <!-- Register Form (Faqat Email va Parol qoldi) -->
            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" required placeholder="example@gmail.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" required placeholder="********">
                </div>
                <button type="submit" class="auth-submit-btn">Sign Up</button>
                <div id="registerMessage" class="auth-message"></div>
            </form>

            <!-- Google Login -->
            <div class="social-login">
                <button type="button" id="googleLoginBtn" class="social-login-btn">Continue with Google</button>
            </div>
        </div>
    </div>

    <!-- SKRIPTLAR -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reading/js/supabaseClient.js"></script>
    <script src="reading/js/article-detail.js"></script>
</body>
</html>
