<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloChiwa - Reader</title>
    <link rel="stylesheet" href="reading/css/reading.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="reading/images/logo.png">
</head>
<body>

    <!-- HEADER -->
<header class="main-header">
    <div class="header-container">
        <a href="articles.html" id="backLink" class="back-link">
            <span>←</span> Back to Articles
        </a>
        
        <!-- Tungi rejim tugmasi -->
        <button id="darkModeToggle" class="dark-mode-btn" title="Tungi rejim">
            🌙
        </button>
    </div>
</header>

    <!-- STANDART EKRAN READ-MODE KONTENT -->
    <main class="reader-container">
        <article class="reader-card">
            <div class="article-meta">
                <span id="articleLevel" class="level-badge">Level</span>
                <span id="articleLanguage" class="lang-badge">Language</span>
            </div>
            
            <h1 id="articleTitle" class="reader-title">Loading title...</h1>
            
            <!-- NOTRANSLATE: Maqola matni tarjima qilinmaydi, asl holida o'qiladi -->
            <div id="articleBody" class="reader-body notranslate">
                <p>Loading text...</p>
            </div>

            <!-- Action Buttons (Like & Share) -->
            <div class="article-actions">
                <button class="action-btn like-btn" id="likeBtn">
                    <span class="icon">❤️</span> 
                    <span class="label">Like</span> 
                    <span class="count" id="likeCount">0</span>
                </button>
                <button class="action-btn share-btn" id="shareBtn">
                    <span class="icon">🔗</span> 
                    <span class="label">Share</span>
                </button>
            </div>

            <!-- Comments Section -->
            <section class="comments-section">
                <h3>Comments (<span id="commentCount">0</span>)</h3>

                <!-- Comment Form -->
                <div class="comment-form">
                    <textarea id="commentInput" placeholder="Write a comment..." rows="3"></textarea>
                    <button id="submitCommentBtn">Post Comment</button>
                </div>

                <!-- Comments List -->
                <div class="comments-list" id="commentsList">
                    <!-- Izohlar JavaScript orqali shu yerga yuklanadi -->
                </div>
            </section>
        </article>
    </main>

    <!-- POP-UP MODAL (So'z tushuntirishi uchun) -->
    <div id="wordModal" class="word-modal hidden">
        <div class="word-modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <h3 id="modalWord" class="modal-word-title">Word</h3>
    <!--       <div id="modalBody" class="modal-word-body">
                <p id="modalDefinition">Loading explanation...</p>
                <p id="modalTranslation" class="modal-translation"></p>
            </div> --> 
        </div>
    </div>

     <!-- STICKY AUDIO PLAYER -->
    <audio id="articleAudio" controls class="sticky-audio-player"></audio>
    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="about.html">About Us</a>
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Contact Us</a>
                <a href="privacy-policy.html">Privacy Policy</a> (yoki privacy.html faylingiz qanday nomlangan bo'lsa)
            </div>
            <p class="copyright">&copy; 2026 HelloChiwa. All rights reserved.</p>
        </div>
    </footer>

    <!-- SKRIPTLAR -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/article-detail.js"></script>
</body>
</html>
